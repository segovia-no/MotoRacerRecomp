# Publishes site/ (the project website) and llms.txt to GitHub Pages.
name: Pages
on:
  push:
    branches: [main]
    paths: [site/**, llms.txt, .github/workflows/pages.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: cp llms.txt site/llms.txt && rm -rf site/tools   # site/tools: the image generator, not published
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
